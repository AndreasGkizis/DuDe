
<div class="main-container">

    <div class="prompt-line">
        <span class="output-status">Welcome to DuDe!</span>
    </div>

    <!-- 1. OPERATION MODE -->
    <section class="operation-section" aria-labelledby="operation-heading">
        <div class="section-label-row">
            <span id="operation-heading" class="section-label">Operation</span>
        </div>

        <div class="operation-selector" role="radiogroup" aria-labelledby="operation-heading">
            <label class="operation-option" for="modeDuplicates">
                <input id="modeDuplicates" type="radio" name="operationMode" value="duplicates"
                    onchange="changeOperationMode(this.value)" checked>
                <span class="operation-option-content">
                    <span class="operation-option-title">Find Duplicates</span>
                    <span class="operation-option-description">Find equivalent files across selected folders.</span>
                </span>
            </label>
            <label class="operation-option" for="modeCoverage">
                <input id="modeCoverage" type="radio" name="operationMode" value="coverage"
                    onchange="changeOperationMode(this.value)">
                <span class="operation-option-content">
                    <span class="operation-option-title">Check Target Coverage</span>
                    <span class="operation-option-description">Check that source content exists somewhere in the target.</span>
                </span>
            </label>
        </div>
    </section>

    <!-- 2. CORE CONFIGURATION SECTION (Directories) -->
    <div id="duplicateFolders" class="input-group mb-6">

        <label>Directories to Scan
            <span class="tooltip-container">
                <span class="info-icon">i</span>
                <span class="tooltip-text">Add one or more folders to scan. Duplicates are found across <b>all</b> supplied directories.</span>
            </span>
        </label>

        <div id="dirList">
            <div class="dir-row" data-index="0">
                <input class="input dir-input" type="text" readonly placeholder="Nothing selected!">
                <button class="btn btn-select" onclick="selectAndSetDir(this)">Select</button>
                <button class="btn btn-remove-dir" onclick="removeDir(this)" disabled title="Remove directory">−</button>
            </div>
        </div>

        <button class="btn btn-add-dir" id="addDirBtn" onclick="addDir()">+ Add Directory</button>
    </div>

    <div id="coverageFolders" class="input-group coverage-folders" hidden>
        <div class="coverage-folder-field">
            <label for="sourceDir">Source Folder
                <span class="tooltip-container">
                    <span class="info-icon">i</span>
                    <span class="tooltip-text">Every eligible file in this folder must have equivalent content somewhere in the target.</span>
                </span>
            </label>
            <div class="dir-chooser">
                <input class="input dir-input" id="sourceDir" type="text" readonly placeholder="Nothing selected!">
                <button class="btn btn-select" onclick="selectAndSetDir('sourceDir')">Select</button>
            </div>
        </div>

        <div class="coverage-folder-field">
            <label for="targetDir">Target Folder
                <span class="tooltip-container">
                    <span class="info-icon">i</span>
                    <span class="tooltip-text">Equivalent content may appear under any filename or relative location in this folder.</span>
                </span>
            </label>
            <div class="dir-chooser">
                <input class="input dir-input" id="targetDir" type="text" readonly placeholder="Nothing selected!">
                <button class="btn btn-select" onclick="selectAndSetDir('targetDir')">Select</button>
            </div>
        </div>

        <div id="folderRelationshipWarning" class="inline-notice inline-notice--warning" role="status" hidden>
            Source and target overlap. Files may satisfy coverage by matching themselves.
        </div>
    </div>

    <!-- 3. ADVANCED SETTINGS SECTION -->

    <div id="advancedSection" class="advanced-section" data-collapsed="true">
        <button id="advancedToggle" class="advanced-toggle" onclick="toggleAdvanced()">
            <span>Advanced Settings</span>
            <svg id="collapseIndicator" class="toggle-indicator" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
        </button>

        <div id="advancedContent" class="advanced-content">

            <div>
                <label for="cacheDir">Cache Directory

                    <span class="tooltip-container tooltip-bottom-left">
                        <span class="info-icon">i</span>
                        <span class="tooltip-text ">Location to store pre-calculated file hashes, enabling speeds up
                            subsequent runs.<br><b> Defaults to Execution Directory.</b></span>
                    </span>
                </label>
                <div class="dir-chooser">
                    <input class="input dir-input" id="cacheDir" type="text" value="" placeholder="Nothing Selected!">
                    <button class="btn btn-select" onclick="selectAndSetDir('cacheDir')">Select</button>
                </div>
            </div>

            <div>
                <label for="resultsDir">Results File Path

                    <span class="tooltip-container tooltip-bottom-left">
                        <span class="info-icon">i</span>
                        <span class="tooltip-text">The full path where the final CSV report will be saved. <br><b>
                                Defaults to Execution Directory.</b></span>
                    </span>
                </label>
                <div class="dir-chooser">
                    <input class="input dir-input" id="resultsDir" type="text" value="" placeholder="Nothing Selected!">
                    <button class="btn btn-select" onclick="selectAndSetDir('resultsDir')">Select</button>
                </div>
            </div>

            <div class="full-width-item stacked-inputs">

                <div>
                    <label for="cpus">CPUs

                        <span class="tooltip-container">
                            <span class="info-icon">i</span>
                            <span class="tooltip-text">Number of CPU cores to use for parallel hashing.(0 means all
                                available cores.)</span>
                        </span>
                    </label>
                    <div class="number-input">
                        <input class="input" id="cpus" type="number" value="0" min="0" max="512">
                        <div class="number-stepper">
                            <button class="number-step-button" type="button" onclick="stepNumberInput('cpus', 1)"
                                aria-label="Increase CPUs" aria-controls="cpus">
                                <svg viewBox="0 0 12 8" aria-hidden="true"><path d="M1 7 6 2l5 5" /></svg>
                            </button>
                            <button class="number-step-button" type="button" onclick="stepNumberInput('cpus', -1)"
                                aria-label="Decrease CPUs" aria-controls="cpus">
                                <svg viewBox="0 0 12 8" aria-hidden="true"><path d="m1 1 5 5 5-5" /></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div>
                    <label for="bufSize">Buffer Size
                        <span class="tooltip-container">
                            <span class="info-icon">i</span>
                            <span class="tooltip-text">I/O buffer size (in KB) when reading files for hashing. Larger
                                size can improve speed on HDDs.</span>
                        </span>
                    </label>
                    <div class="number-input">
                        <input class="input" id="bufSize" type="number" value="1024" min="0" max="1048576">
                        <div class="number-stepper">
                            <button class="number-step-button" type="button" onclick="stepNumberInput('bufSize', 1)"
                                aria-label="Increase buffer size" aria-controls="bufSize">
                                <svg viewBox="0 0 12 8" aria-hidden="true"><path d="M1 7 6 2l5 5" /></svg>
                            </button>
                            <button class="number-step-button" type="button" onclick="stepNumberInput('bufSize', -1)"
                                aria-label="Decrease buffer size" aria-controls="bufSize">
                                <svg viewBox="0 0 12 8" aria-hidden="true"><path d="m1 1 5 5 5-5" /></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="full-width-item checkbox-container">
                <input type="checkbox" id="paranoidMode" class="checkbox-input">
                <label for="paranoidMode">
                    Paranoid Mode (Strict Validation)
                    <span class="tooltip-container tooltip-top">
                        <span class="info-icon">i</span>
                        <span class="tooltip-text">Checks the found duplicates <b>byte by byte</b>. <br>Slower! but 100%
                            correct.</span>
                    </span>
                </label>
            </div>

            <div class="full-width-item checkbox-container">
                <input type="checkbox" id="debugMode" class="checkbox-input">
                <label for="debugMode">
                    Keep Logs of the Execution
                    <span class="tooltip-container tooltip-top">
                        <span class="info-icon">i</span>
                        <span class="tooltip-text">Decides on whether to keep execution logs or not.<br><b> Defaults to
                                Execution Directory.</b></span>
                    </span>
                </label>
            </div>

            <div class="full-width-item checkbox-container">
                <input type="checkbox" id="keepMemory" class="checkbox-input" checked>
                <label for="keepMemory">
                    Keep Memory of run
                    <span class="tooltip-container tooltip-top">
                        <span class="info-icon">i</span>
                        <span class="tooltip-text">Decides on whether to keep a memory of the run in the form of
                            <b>memory.db</b></span>
                    </span>
                </label>
            </div>

        </div>
    </div>

    <!-- EXECUTION BUTTON -->
    <div class="execute-box">
        <button id="startButton" class="btn btn-execute" onclick="startProcess()">
            <span id="startText">Start</span>
            <span id="startButtonSpinner" class="spinner-hidden"></span>
        </button>
        <button id="stopButton" class="btn btn-stop" onclick="cancelProcess()" disabled>
            Stop
        </button>
        <button id="fullResetButton" class="btn btn-full-reset" onclick="fullReset()">
            Full Reset
        </button>
    </div>

    <!-- STATUS AREA -->
    <div id="status-area">
        <div class="progress-container">
            <div id="progress-bar" class="progress-bar" style="width: 0%;"></div>
        </div>

        <div class="status-panel">
            <div class="status-row">
                <span class="status-label">Current Job</span>
                <span id="status-job" class="status-value">Ready to run.</span>
            </div>
            <div class="status-row">
                <span class="status-label">Files Checked</span>
                <span id="status-files" class="status-value">&mdash;</span>
            </div>
            <div class="status-row">
                <span id="status-metric-label" class="status-label">Duplicates Found</span>
                <span id="status-duplicates" class="status-value">&mdash;</span>
            </div>
            <div id="status-error" class="status-error" style="display:none;"></div>
        </div>
    </div>

    <div id="coverage-summary" class="coverage-summary" hidden>
        <div class="coverage-summary-heading">
            <span>Source Coverage</span>
            <span id="coverage-outcome" class="coverage-outcome">Awaiting a coverage run</span>
        </div>
        <div class="coverage-summary-metrics">
            <div class="coverage-summary-metric">
                <span id="coverage-covered" class="coverage-summary-value">&mdash;</span>
                <span class="coverage-summary-label">covered / total</span>
            </div>
            <div class="coverage-summary-metric">
                <span id="coverage-missing" class="coverage-summary-value">&mdash;</span>
                <span class="coverage-summary-label">missing files</span>
            </div>
        </div>
    </div>

    <!-- OPEN RESULTS FOLDER - always visible -->
    <!-- DUPLICATE RESULTS SECTION -->
    <div class="results-header">
        <span id="results-count-label">Results</span>
        <div class="results-header-actions">
            <label class="results-page-size-control" for="resultsPageSize">
                <span id="page-size-label">Groups per page</span>
                <select id="resultsPageSize" class="input results-page-size-select" onchange="changeResultsPageSize(this.value)" disabled>
                    <option value="3" selected>3</option>
                    <option value="5">5</option>
                    <option value="10">10</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                </select>
            </label>
            <button id="clearResultsButton" class="btn btn-clear-results" onclick="clearResults()" disabled>
                Clear Results
            </button>
            <button id="showResultsButton" class="btn btn-show-results" onclick="showResults()" disabled>
                Open Results Folder
            </button>
        </div>
    </div>

    <div id="results-section" style="display:none;">
        <div class="results-controls" id="results-controls-top">
            <button class="btn btn-page" id="prev-page-top" onclick="goToPage(currentPage - 1)">&#8592; Prev</button>
            <span id="page-indicator-top" class="page-indicator"></span>
            <button class="btn btn-page" id="next-page-top" onclick="goToPage(currentPage + 1)">Next &#8594;</button>
        </div>
        <div id="results-list" class="results-list"></div>
        <div class="results-controls" id="results-controls-bottom">
            <button class="btn btn-page" id="prev-page-bottom" onclick="goToPage(currentPage - 1)">&#8592; Prev</button>
            <span id="page-indicator-bottom" class="page-indicator"></span>
            <button class="btn btn-page" id="next-page-bottom" onclick="goToPage(currentPage + 1)">Next &#8594;</button>
        </div>
    </div>
</div>
