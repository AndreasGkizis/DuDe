name: Wails Release
on:
  push:
    tags:
      - 'v*'
    workflow_dispatch:
      inputs:
        version:
          description: Release version, for example 1.2.0
          required: true
          type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact: DuDe.exe
            package: DuDe_Windows_x64.zip
          - os: ubuntu-latest
            platform: linux/amd64
            artifact: DuDe
            package: DuDe_Linux_x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Install Linux dependencies (required for Wails on Ubuntu runners)
      - name: Install Linux Dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Sync Version from Tag
        shell: bash
        run: |
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}"
          VERSION="${VERSION#v}"
          sed -i "s/\"productVersion\": \".*\"/\"productVersion\": \"$VERSION\"/" wails.json

      - name: Build Wails App
        # -s -w strips debug info for smaller, cleaner binaries
        # -webview2 embed is included here. Wails ignores it on non-Windows builds.
        run: wails build -platform ${{ matrix.platform }} -ldflags "-s -w" -webview2 embed

      # Platform-specific packaging
      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path build/bin/${{ matrix.artifact }} -DestinationPath ${{ matrix.package }}

      - name: Package Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: tar -czf ${{ matrix.package }} -C build/bin ${{ matrix.artifact }}

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.package }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
